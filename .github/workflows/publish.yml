name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # A job-level permissions block replaces the workflow-level one rather than
      # extending it, so checkout's contents: read has to be repeated here.
      contents: read
      # PyPI trusted publishing — no long-lived API token in repository secrets.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build==1.3.0

      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # a version published by hand earlier must not fail the release
          skip-existing: true

  # Deliberately not "needs: publish": the image must still be built when the
  # PyPI job is skipped or fails, for instance for a version published by hand.
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # for the build provenance attestation
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects an uppercase image name and the owner is F6-Security.
      - name: Resolve the image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 included so Apple Silicon does not fall back to emulation
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
